server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # nginx:alpine kennt .webmanifest nicht (sonst application/octet-stream); .wasm kennt es.
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;

    # add_header in einer location ersetzt die geerbten – deshalb überall einbinden.
    include /etc/nginx/snippets/security-headers.conf;

    # Gehashte Build-Dateien (inkl. WASM) dürfen lange im Cache bleiben.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Service Worker, Manifest und Einstieg immer frisch prüfen, sonst hängen Updates.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / { try_files $uri $uri/ /index.html; }
}
