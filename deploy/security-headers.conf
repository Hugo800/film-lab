# Sicherheits-Header für Film Lab. Wird von deploy/nginx.conf eingebunden und vom
# Ende-zu-Ende-Test (scripts/browser-test.mjs) gelesen, damit dort dieselbe CSP gilt.
# Alles läuft im Browser: keine Anfragen an fremde Server, Fotos verlassen das Gerät nicht.
# 'wasm-unsafe-eval' braucht WebAssembly (mozjpeg, LibRaw); blob: für Worker und Vorschaubilder.
# 'unsafe-eval' braucht der LibRaw-Worker (Emscripten/embind erzeugt Funktionen per new Function),
# sonst scheitert jede RAW-Datei mit „Evaluating a string as JavaScript violates …“. Die Seite lädt
# keine fremden Inhalte, das Risiko ist entsprechend klein.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
