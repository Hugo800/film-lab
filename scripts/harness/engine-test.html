<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine-Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; }
  #c { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  // Prüfseite für scripts/engine-test.mjs. Rechnet im Browser, liefert nur Zahlen/kleine PNGs zurück.
  import { createEngine } from '/src/engine/index.ts';
  // Looks dynamisch: Ein gerade umgebautes looks-Modul soll die Engine-Prüfung nicht blockieren.
  let LOOKS = [];
  try { ({ LOOKS } = await import('/src/looks/index.ts')); } catch (e) { console.warn('looks nicht ladbar:', String(e)); }
  function identityLut(n) {
    const data = new Float32Array(n * n * n * 3);
    for (let b = 0; b < n; b++) for (let g = 0; g < n; g++) for (let r = 0; r < n; r++)
      data.set([r / (n - 1), g / (n - 1), b / (n - 1)], (r + g * n + b * n * n) * 3);
    return { size: n, data };
  }
  import { DEFAULT_PARAMS } from '/src/types.ts';
  import { encodeJpeg, loadFile } from '/src/io/index.ts';

  const canvas = document.getElementById('c');
  let engine = createEngine(canvas);
  const sources = {};

  // Testbilder sind Display P3; mit colorSpace 'srgb' gelten dieselben Rohwerte als sRGB.
  async function load(name, colorSpace = 'display-p3') {
    const key = name + '|' + colorSpace;
    if (sources[key]) return sources[key];
    const blob = await (await fetch('/testbilder/' + name)).blob();
    const bmp = await createImageBitmap(blob, {
      colorSpaceConversion: 'none', imageOrientation: 'from-image', premultiplyAlpha: 'none',
    });
    return (sources[key] = {
      id: key, fileName: name, width: bmp.width, height: bmp.height,
      colorSpace, pixels: bmp, meta: {}, isRaw: false,
    });
  }

  // Referenz für P3-Quellen: der Browser rechnet beim Zeichnen in einen sRGB-Canvas selbst um.
  async function srgbReference(name) {
    const blob = await (await fetch('/testbilder/' + name)).blob();
    const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image', premultiplyAlpha: 'none' });
    const c = new OffscreenCanvas(bmp.width, bmp.height);
    const g = c.getContext('2d', { colorSpace: 'srgb' });
    g.drawImage(bmp, 0, 0);
    bmp.close();
    return new Uint8Array(g.getImageData(0, 0, c.width, c.height).data.buffer);
  }

  // Referenzpixel ohne Engine-Code: Bitmap roh in eine Textur, per Framebuffer zurücklesen.
  function reference(bmp) {
    const gl = new OffscreenCanvas(1, 1).getContext('webgl2');
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const out = new Uint8Array(bmp.width * bmp.height * 4);
    gl.readPixels(0, 0, bmp.width, bmp.height, gl.RGBA, gl.UNSIGNED_BYTE, out);
    gl.getExtension('WEBGL_lose_context')?.loseContext();
    return out;
  }

  function diff(a, b) {
    let max = 0, sum = 0, over2 = 0, n = 0;
    for (let i = 0; i < a.length; i++) {
      if ((i & 3) === 3) continue;
      const d = Math.abs(a[i] - b[i]);
      if (d > max) max = d;
      if (d > 2) over2++;
      sum += d; n++;
    }
    return { max, mean: sum / n, over2 };
  }

  // Box-Verkleinerung mit derselben Pixelzuordnung wie die Engine (Fläche k×k um die Mitte).
  function boxDown(img, w, h) {
    const out = new Float64Array(w * h * 4), cnt = new Float64Array(w * h);
    const kx = img.width / w, ky = img.height / h;
    for (let y = 0; y < img.height; y++) {
      const ty = Math.min(h - 1, Math.floor((y + 0.5) / ky));
      for (let x = 0; x < img.width; x++) {
        const tx = Math.min(w - 1, Math.floor((x + 0.5) / kx));
        const o = (ty * w + tx), i = (y * img.width + x) * 4;
        out[o * 4] += img.data[i]; out[o * 4 + 1] += img.data[i + 1]; out[o * 4 + 2] += img.data[i + 2];
        cnt[o]++;
      }
    }
    const r = new Uint8Array(w * h * 4);
    for (let o = 0; o < w * h; o++) for (let c = 0; c < 4; c++) r[o * 4 + c] = c === 3 ? 255 : Math.round(out[o * 4 + c] / cnt[o]);
    return r;
  }

  function stats(img, x0, y0, w, h) {
    // Standardabweichung der Luma-Differenz zu 3×3-Mittel → Maß für feines Rauschen.
    let s = 0, s2 = 0, n = 0;
    const L = (x, y) => { const i = (y * img.width + x) * 4; return 0.2126 * img.data[i] + 0.7152 * img.data[i + 1] + 0.0722 * img.data[i + 2]; };
    for (let y = y0 + 1; y < y0 + h - 1; y++) for (let x = x0 + 1; x < x0 + w - 1; x++) {
      let m = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) m += L(x + dx, y + dy);
      const d = L(x, y) - m / 9;
      s += d; s2 += d * d; n++;
    }
    return Math.sqrt(s2 / n - (s / n) ** 2);
  }

  async function png(data, w, h, x0 = 0, y0 = 0, cw = w, ch = h) {
    const c = new OffscreenCanvas(cw, ch);
    const id = new ImageData(cw, ch);
    for (let y = 0; y < ch; y++) id.data.set(data.subarray(((y0 + y) * w + x0) * 4, ((y0 + y) * w + x0 + cw) * 4), y * cw * 4);
    c.getContext('2d').putImageData(id, 0, 0);
    const b = await c.convertToBlob({ type: 'image/png' });
    const bytes = new Uint8Array(await b.arrayBuffer());
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }

  function readCanvas() {
    const gl = canvas.getContext('webgl2');
    const w = canvas.width, h = canvas.height;
    const raw = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, raw);
    const out = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) out.set(raw.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
    return { data: out, width: w, height: h };
  }

  function crop(img, x0, y0, w, h) {
    const out = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) out.set(img.data.subarray(((y0 + y) * img.width + x0) * 4, ((y0 + y) * img.width + x0 + w) * 4), y * w * 4);
    return out;
  }

  const P = (o) => ({ ...DEFAULT_PARAMS, ...o });

  // Synthetische Quelle: waagrechter Grauverlauf 0..255 (für Kornmessungen ohne Bildinhalt).
  function rampSource(w, h) {
    const data = new Uint8Array(w * h * 4);
    for (let x = 0; x < w; x++) {
      const v = Math.round((x / (w - 1)) * 255);
      for (let y = 0; y < h; y++) data.set([v, v, v, 255], (y * w + x) * 4);
    }
    return { id: 'ramp' + w, fileName: 'ramp', width: w, height: h, colorSpace: 'srgb', pixels: { data, width: w, height: h }, meta: {}, isRaw: false };
  }

  function gaussBlur(a, w, h, s) {
    const r = Math.ceil(3 * s), k = [];
    let ks = 0;
    for (let i = -r; i <= r; i++) { const v = Math.exp(-i * i / (2 * s * s)); k.push(v); ks += v; }
    const t = new Float32Array(w * h), o = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let i = -r; i <= r; i++) acc += k[i + r] * a[y * w + Math.min(w - 1, Math.max(0, x + i))];
      t[y * w + x] = acc / ks;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let i = -r; i <= r; i++) acc += k[i + r] * t[Math.min(h - 1, Math.max(0, y + i)) * w + x];
      o[y * w + x] = acc / ks;
    }
    return o;
  }

  // Kornmaß wie für die Referenzbilder: Luma minus Gauß (σ 3 px), σ je Helligkeitsklasse (8 × 32 Stufen),
  // Autokorrelation bei 1 px Abstand, Farbanteil.
  function grainStats(img, x0, y0, w, h) {
    const L = new Float32Array(w * h), ch = [0, 1, 2].map(() => new Float32Array(w * h));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = ((y0 + y) * img.width + x0 + x) * 4, o = y * w + x;
      for (let c = 0; c < 3; c++) ch[c][o] = img.data[i + c];
      L[o] = 0.2126 * ch[0][o] + 0.7152 * ch[1][o] + 0.0722 * ch[2][o];
    }
    const lb = gaussBlur(L, w, h, 3);
    const hpc = ch.map((a) => { const b = gaussBlur(a, w, h, 3); return a.map((v, i) => v - b[i]); });
    const bins = Array.from({ length: 8 }, () => [0, 0]);
    let c0 = 0, c1 = 0, chroma = 0, n = 0;
    for (let y = 8; y < h - 8; y++) for (let x = 8; x < w - 9; x++) {
      const i = y * w + x, d = L[i] - lb[i], d1 = L[i + 1] - lb[i + 1];
      const b = bins[Math.min(7, Math.floor(lb[i] / 32))];
      b[0] += d * d; b[1]++;
      c0 += d * d; c1 += d * d1; n++;
      const m = (hpc[0][i] + hpc[1][i] + hpc[2][i]) / 3;
      chroma += ((hpc[0][i] - m) ** 2 + (hpc[1][i] - m) ** 2 + (hpc[2][i] - m) ** 2) / 3;
    }
    return { sigma: bins.map(([s2, k]) => (k > 100 ? Math.sqrt(s2 / k) : null)), ak1: c1 / c0, colorRatio: Math.sqrt(chroma / c0) };
  }

  const lin8 = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  function oklab(r, g, b) {
    r = lin8(r); g = lin8(g); b = lin8(b);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
  }
  // Mittlerer OKLab-Abstand (×100) zweier gleich großer RGBA-Bilder, optional nur Pixel mit Chroma ≥ minC in `a`
  // und (hue = [Mitte in Grad, Mindest-cos]) nur Farbtöne nahe der Mitte.
  function dOk(a, b, minC = 0, hue = null) {
    let s = 0, n = 0, dl = 0;
    for (let i = 0; i < a.length; i += 4) {
      const p = oklab(a[i], a[i + 1], a[i + 2]), q = oklab(b[i], b[i + 1], b[i + 2]);
      if (Math.hypot(p[1], p[2]) < minC) continue;
      if (hue && Math.cos(Math.atan2(p[2], p[1]) - (hue[0] * Math.PI) / 180) < hue[1]) continue;
      s += Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); dl += q[0] - p[0]; n++;
    }
    return { dE: (100 * s) / n, dL: (100 * dl) / n, n };
  }

  async function loadRgba(path) {
    const bmp = await createImageBitmap(await (await fetch(path)).blob(), { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
    const c = new OffscreenCanvas(bmp.width, bmp.height);
    const g = c.getContext('2d');
    g.drawImage(bmp, 0, 0);
    return { data: new Uint8Array(g.getImageData(0, 0, c.width, c.height).data.buffer), width: c.width, height: c.height };
  }

  // Bilder nebeneinander mit Beschriftung (oben), als PNG.
  async function stripPng(images, labels) {
    const gap = 6, top = 26;
    const W = images.reduce((s, im) => s + im.width + gap, -gap), H = Math.max(...images.map((im) => im.height)) + top;
    const c = new OffscreenCanvas(W, H), g = c.getContext('2d');
    g.fillStyle = '#202022'; g.fillRect(0, 0, W, H);
    g.font = '16px sans-serif'; g.fillStyle = '#eee';
    let x = 0;
    images.forEach((im, k) => {
      g.putImageData(new ImageData(new Uint8ClampedArray(im.data.buffer, im.data.byteOffset, im.data.length).slice(), im.width, im.height), x, top);
      g.fillText(labels[k], x + 6, 19);
      x += im.width + gap;
    });
    const id = g.getImageData(0, 0, W, H);
    return png(new Uint8Array(id.data.buffer), W, H);
  }

  function cropImg(img, x0, y0, w, h, zoom = 1) {
    const out = new Uint8Array(w * zoom * h * zoom * 4);
    for (let y = 0; y < h * zoom; y++) for (let x = 0; x < w * zoom; x++) {
      const i = ((y0 + Math.floor(y / zoom)) * img.width + x0 + Math.floor(x / zoom)) * 4;
      out.set(img.data.subarray(i, i + 4), (y * w * zoom + x) * 4);
    }
    return { data: out, width: w * zoom, height: h * zoom };
  }
  const look = (id) => (id === 'identity' ? identityLut(33) : id ? (LOOKS.find((l) => l.id === id) ?? LOOKS[0])?.buildLut() ?? null : null);

  // CIEDE2000 zweier sRGB-Bilder (mittel, 99. Perzentil); wie scripts/diag-staerke.html.
  const RAD = Math.PI / 180;
  function lab8(r, g, b) {
    const R = lin8(r), G = lin8(g), B = lin8(b);
    const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : ((24389 / 27) * t + 16) / 116);
    const fx = f((0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047);
    const fy = f(0.2126729 * R + 0.7151522 * G + 0.072175 * B);
    const fz = f((0.0193339 * R + 0.119192 * G + 0.9503041 * B) / 1.08883);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  function dE2000([l1, a1, b1], [l2, a2, b2]) {
    const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cm7 = ((C1 + C2) / 2) ** 7;
    const G = 0.5 * (1 - Math.sqrt(Cm7 / (Cm7 + 6103515625)));
    const a1p = (1 + G) * a1, a2p = (1 + G) * a2, C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
    const hh = (b, a) => { const t = Math.atan2(b, a) / RAD; return t < 0 ? t + 360 : t; };
    const h1 = C1p === 0 ? 0 : hh(b1, a1p), h2 = C2p === 0 ? 0 : hh(b2, a2p);
    let dh = h2 - h1;
    if (C1p * C2p === 0) dh = 0; else if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
    const dH = 2 * Math.sqrt(C1p * C2p) * Math.sin((dh * RAD) / 2);
    const Lm = (l1 + l2) / 2, Cmp = (C1p + C2p) / 2;
    let hm = h1 + h2;
    if (C1p * C2p !== 0) hm = Math.abs(h1 - h2) <= 180 ? hm / 2 : (hm + (hm < 360 ? 360 : -360)) / 2;
    const T = 1 - 0.17 * Math.cos((hm - 30) * RAD) + 0.24 * Math.cos(2 * hm * RAD) + 0.32 * Math.cos((3 * hm + 6) * RAD) - 0.2 * Math.cos((4 * hm - 63) * RAD);
    const dTh = 30 * Math.exp(-(((hm - 275) / 25) ** 2)), Cmp7 = Cmp ** 7;
    const Rc = 2 * Math.sqrt(Cmp7 / (Cmp7 + 6103515625));
    const Sl = 1 + (0.015 * (Lm - 50) ** 2) / Math.sqrt(20 + (Lm - 50) ** 2), Sc = 1 + 0.045 * Cmp, Sh = 1 + 0.015 * Cmp * T;
    const x = (l2 - l1) / Sl, y = (C2p - C1p) / Sc, z = dH / Sh;
    return Math.sqrt(Math.max(0, x * x + y * y + z * z - Math.sin(2 * dTh * RAD) * Rc * y * z));
  }
  function de2000(a, b) {
    const n = a.length / 4, d = new Float32Array(n);
    let s = 0;
    for (let i = 0; i < n; i++) {
      const j = i * 4;
      d[i] = dE2000(lab8(a[j], a[j + 1], a[j + 2]), lab8(b[j], b[j + 1], b[j + 2]));
      s += d[i];
    }
    d.sort();
    return { mean: s / n, p99: d[Math.floor(n * 0.99)], max: d[n - 1] };
  }

  window.T = {
    looks: () => LOOKS.map((l) => l.id),
    gpu: () => {
      const gl = canvas.getContext('webgl2');
      return { maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE), cbf: !!gl.getExtension('EXT_color_buffer_float') };
    },

    async identity(name, tileSize, colorSpace) {
      const src = await load(name, colorSpace);
      const t0 = performance.now();
      const img = await engine.exportPixels(src, identityLut(33), P({}), { tileSize });
      const ms = performance.now() - t0;
      const raw = reference(src.pixels);
      const ref = colorSpace === 'srgb' ? raw : await srgbReference(name);
      const rawVsRef = diff(raw, ref).mean;
      // Gegenprobe: um eine Zeile verschoben bzw. gespiegelt muss deutlich abweichen.
      const flipped = new Uint8Array(ref.length);
      const rowB = src.width * 4;
      for (let y = 0; y < src.height; y++) flipped.set(ref.subarray(y * rowB, (y + 1) * rowB), (src.height - 1 - y) * rowB);
      return { w: img.width, h: img.height, ms, ...diff(img.data, ref), rawVsRef, vsFlipped: diff(img.data, flipped).mean };
    },

    // RAW-Pfad: Quelle als RGBA-Puffer statt ImageBitmap (Hochladen per UNPACK_SKIP_*).
    async identityRaw(name) {
      const src = await load(name, 'srgb');
      const ref = reference(src.pixels);
      const raw = { ...src, id: name + '-raw', pixels: { data: ref, width: src.width, height: src.height } };
      const img = await engine.exportPixels(raw, null, P({}), { tileSize: 1024 });
      const small = await engine.exportPixels(raw, null, P({}), { maxEdge: 1000 });
      const smallBmp = await engine.exportPixels(src, null, P({}), { maxEdge: 1000 });
      return { w: img.width, h: img.height, ...diff(img.data, ref), smallVsBitmap: diff(small.data, smallBmp.data).max };
    },

    async seams(name, params, lutId) {
      const src = await load(name);
      const lut = look(lutId);
      const a = await engine.exportPixels(src, lut, P(params), { tileSize: 512 });
      const t0 = performance.now();
      const b = await engine.exportPixels(src, lut, P(params), { tileSize: 2048 });
      const ms = performance.now() - t0;
      return { ms, ...diff(a.data, b.data) };
    },

    async previewVsExport(name, params, lutId) {
      const src = await load(name);
      const lut = look(lutId);
      engine.setSource(src);
      engine.setLut(lut);
      await engine.ready();
      engine.render(P(params));
      const cv = readCanvas();
      // Bildrechteck im Canvas finden (Hintergrund transparent).
      let x0 = cv.width, x1 = 0, y0 = cv.height, y1 = 0;
      for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) if (cv.data[(y * cv.width + x) * 4 + 3]) {
        x0 = Math.min(x0, x); x1 = Math.max(x1, x + 1); y0 = Math.min(y0, y); y1 = Math.max(y1, y + 1);
      }
      const w = x1 - x0, h = y1 - y0;
      const prev = crop(cv, x0, y0, w, h);
      const small = await engine.exportPixels(src, lut, P(params), { maxEdge: Math.max(w, h) });
      const full = await engine.exportPixels(src, lut, P(params), {});
      const down = boxDown(full, w, h);
      const pvImg = { data: prev, width: w, height: h };
      const cx = Math.floor(w / 2) - 100, cy = Math.floor(h / 2) - 100;
      return {
        rect: [x0, y0, w, h], small: [small.width, small.height],
        vsSmall: small.width === w && small.height === h ? diff(prev, small.data) : null,
        vsDownscaledFull: diff(prev, down),
        smallVsDown: small.width === w && small.height === h ? diff(small.data, down) : null,
        noise: { preview: stats(pvImg, cx, cy, 200, 200), small: stats(small, cx, cy, 200, 200), downFull: stats({ data: down, width: w, height: h }, cx, cy, 200, 200) },
        png: { preview: await png(prev, w, h), down: await png(down, w, h) },
      };
    },

    // Vorschau rendern; Bildschirmfoto macht das Node-Skript.
    async show(name, params, lutId, opts) {
      const src = await load(name);
      engine.setSource(src);
      engine.setLut(look(lutId));
      await engine.ready();
      engine.render(P(params), opts);
      const t0 = performance.now();
      const gl = canvas.getContext('webgl2'), px = new Uint8Array(4);
      for (let i = 0; i < 5; i++) {
        engine.render(P({ ...params, exposure: (params.exposure ?? 0) + i * 0.01 }), opts);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // wartet auf die GPU
      }
      const ms = (performance.now() - t0) / 5;
      engine.render(P(params), opts);
      const cv = readCanvas();
      return { ms, png: await png(cv.data, cv.width, cv.height) };
    },

    // Ausschnitt in voller Auflösung (100 %) als PNG.
    async fullCrop(name, params, lutId, rx, ry, cw, ch) {
      const src = await load(name);
      const img = await engine.exportPixels(src, look(lutId), P(params), {});
      const x0 = Math.round(rx * (img.width - cw)), y0 = Math.round(ry * (img.height - ch));
      return {
        png: await png(img.data, img.width, img.height, x0, y0, cw, ch),
        noise: stats(img, x0, y0, Math.min(cw, 300), Math.min(ch, 300)),
      };
    },

    async timing(name, params, lutId) {
      const src = await load(name);
      const steps = [];
      const t0 = performance.now();
      const img = await engine.exportPixels(src, look(lutId), P(params), { onProgress: (f) => steps.push(+f.toFixed(3)) });
      return { ms: performance.now() - t0, w: img.width, h: img.height, steps };
    },

    async abort(name) {
      const src = await load(name);
      const ac = new AbortController();
      const p = engine.exportPixels(src, null, P({ grainEffect: 2 }), { signal: ac.signal, tileSize: 512, onProgress: (f) => { if (f > 0.2) ac.abort(); } });
      try { await p; return 'nicht abgebrochen'; } catch (e) { return e.name; }
    },

    // Ganzer Weg wie in der App: io.loadFile → exportJpeg (encodeJpeg + withMetadata).
    async jpeg(name, params, lutId) {
      const t0 = performance.now();
      try {
        const file = new File([await (await fetch('/testbilder/' + name)).blob()], name, { type: 'image/jpeg' });
        const src = await loadFile(file);
        const blob = await engine.exportJpeg(src, look(lutId), P(params), { quality: 90 });
        const bytes = new Uint8Array(await blob.arrayBuffer());
        // Speicher: der Exportpuffer muss in den Worker verschoben werden (danach leer), nicht kopiert.
        const px = await engine.exportPixels(src, null, P({}), { maxEdge: 1000 });
        await encodeJpeg(px.data, px.width, px.height, 90);
        const transferred = px.data.byteLength === 0;
        const segs = [];
        for (let i = 2; i < bytes.length && bytes[i] === 0xff && bytes[i + 1] !== 0xda; ) {
          const len = (bytes[i + 2] << 8) | bytes[i + 3];
          segs.push(bytes[i + 1].toString(16) + ':' + String.fromCharCode(...bytes.subarray(i + 4, i + 8)).replace(/[^\x20-\x7e]/g, '.'));
          i += 2 + len;
        }
        const bmp = await createImageBitmap(blob);
        return { ms: performance.now() - t0, bytes: blob.size, type: blob.type, w: bmp.width, h: bmp.height, colorSpace: src.colorSpace, segs, transferred };
      } catch (e) {
        return { error: String(e) };
      }
    },

    canvasInfo() {
      return { buffer: [canvas.width, canvas.height], css: [canvas.clientWidth, canvas.clientHeight], dpr: devicePixelRatio,
        colorSpace: canvas.getContext('webgl2').drawingBufferColorSpace };
    },

    async thumbs(name, ids) {
      const src = await load(name);
      engine.setSource(src);
      await engine.ready();
      const t0 = performance.now();
      const bitmaps = [];
      for (const id of ids) bitmaps.push(await engine.renderThumbnail(look(id), P((LOOKS.find((l) => l.id === id) ?? {}).defaults ?? {}), 240));
      const ms = (performance.now() - t0) / ids.length;
      const c = new OffscreenCanvas(bitmaps.reduce((s, b) => s + b.width + 4, 0), 240);
      const g = c.getContext('2d');
      let x = 0;
      for (const b of bitmaps) { g.drawImage(b, x, 0); x += b.width + 4; b.close(); }
      const id = g.getImageData(0, 0, c.width, c.height);
      return { ms, png: await png(new Uint8Array(id.data.buffer), c.width, c.height) };
    },

    async contextLoss(name, params) {
      const src = await load(name);
      engine.setSource(src);
      await engine.ready();
      engine.render(P(params));
      const before = readCanvas();
      const ext = canvas.getContext('webgl2').getExtension('WEBGL_lose_context');
      const restored = new Promise((r) => canvas.addEventListener('webglcontextrestored', r, { once: true }));
      ext.loseContext();
      await new Promise((r) => setTimeout(r, 50));
      engine.render(P(params)); // darf nicht werfen
      ext.restoreContext();
      await restored;
      await new Promise((r) => setTimeout(r, 0));
      await engine.ready();
      engine.render(P(params));
      const after = readCanvas();
      const thumb = await engine.renderThumbnail(null, P(params), 100);
      return { ...diff(before.data, after.data), thumb: [thumb.width, thumb.height] };
    },

    // Stufen eines Effekts nebeneinander: ganzes Bild (maxEdge) oder 100-%-Ausschnitt (crop = [rx, ry, w, h, zoom]).
    async strip(name, variants, lutId, maxEdge, crop) {
      const src = name === 'ramp' ? rampSource(6000, 4000) : await load(name);
      const lut = look(lutId);
      const imgs = [];
      for (const v of variants) {
        const img = await engine.exportPixels(src, v.lut === undefined ? lut : look(v.lut), P(v.params), crop ? {} : { maxEdge });
        if (crop) {
          const [rx, ry, w, h, z] = crop;
          imgs.push(cropImg(img, Math.round(rx * (img.width - w)), Math.round(ry * (img.height - h)), w, h, z ?? 1));
        } else imgs.push(img);
      }
      return { png: await stripPng(imgs, variants.map((v) => v.label)) };
    },

    // Kornmessung auf dem Grauverlauf in voller Auflösung (6000×4000) und in der Vorschaugröße.
    async grainMeasure(params) {
      const src = rampSource(6000, 4000);
      const full = await engine.exportPixels(src, null, P(params), {});
      const small = await engine.exportPixels(src, null, P(params), { maxEdge: 2560 });
      return { full: grainStats(full, 0, 1800, 6000, 240), preview: grainStats(small, 0, 760, 2560, 120) };
    },

    // Messung an einem Referenzbild (Pfad unter /testbilder/).
    async refGrain(path) {
      const img = await loadRgba('/testbilder/' + path);
      return grainStats(img, 0, 0, img.width, img.height);
    },

    // Color Chrome: Referenz „aus“ mit unserer Engine bearbeiten und mit „stark“ vergleichen.
    async colorChrome(off, on, params, hue = null) {
      const a = await loadRgba('/testbilder/' + off), b = await loadRgba('/testbilder/' + on);
      const src = { id: off, fileName: off, width: a.width, height: a.height, colorSpace: 'srgb', pixels: a, meta: {}, isRaw: false };
      const ours = await engine.exportPixels(src, null, P(params), {});
      return {
        refOffVsOn: dOk(a.data, b.data), oursVsOn: dOk(ours.data, b.data),
        satOffVsOn: dOk(a.data, b.data, 0.08, hue), satOursVsOn: dOk(ours.data, b.data, 0.08, hue), satOffVsOurs: dOk(a.data, ours.data, 0.08, hue),
        // 8× verkleinert: Wind/Versatz zwischen den Aufnahmen fällt heraus.
        small: (() => {
          const w = Math.floor(a.width / 8), h = Math.floor(a.height / 8), d = (im) => boxDown(im, w, h);
          const [sa, sb, so] = [d(a), d(b), d(ours)];
          return { offVsOn: dOk(sa, sb), oursVsOn: dOk(so, sb), satOffVsOn: dOk(sa, sb, 0.08, hue), satOursVsOn: dOk(so, sb, 0.08, hue),
            satOffVsOurs: dOk(sa, so, 0.08, hue) };
        })(),
        png: await stripPng([a, ours, b].map((im) => cropImg(im, 0, 0, im.width, im.height)), ['Referenz aus', 'Film Lab', 'Referenz stark']),
      };
    },

    // Stärke-Regler (LookParams.strength 0..2, lookDefaults = Vorgaben des Looks):
    // a) s = 1 mit lookDefaults bitgleich zur Rechnung ohne (= wie vor dem Regler-Umbau),
    // b) s = 0 ohne eigene Änderungen ≈ Original, c) Wirkung wächst mit s.
    async strength(name, ids, maxEdge) {
      const src = await load(name);
      const orig = (await engine.exportPixels(src, null, P({}), { maxEdge })).data;
      const out = [];
      for (const id of ids) {
        const l = LOOKS.find((x) => x.id === id);
        const lut = l.buildLut();
        const base = { ...l.defaults, lookDefaults: l.defaults };
        const run = async (p) => (await engine.exportPixels(src, lut, P(p), { maxEdge })).data;
        const alt = await run(l.defaults);
        const s1 = await run({ ...base, strength: 1 });
        const curve = [];
        for (const s of [0, 0.5, 1.5, 2]) curve.push({ s, ...de2000(orig, await run({ ...base, strength: s })) });
        curve.splice(2, 0, { s: 1, ...de2000(orig, s1) });
        out.push({ id, name: l.name, s1VsAlt: diff(alt, s1), curve });
      }
      return out;
    },

    // renderRegion (100 %-Lupe) gegen denselben Ausschnitt aus exportPixels; Vorschau davor/danach unverändert.
    async region(name, params, lutId, cw, ch) {
      const src = await load(name);
      const lut = look(lutId);
      const x0 = Math.floor((src.width - cw) / 2), y0 = Math.floor((src.height - ch) / 2);
      const rect = { x0, y0, x1: x0 + cw, y1: y0 + ch };
      const bmpPixels = (b) => {
        const g = new OffscreenCanvas(b.width, b.height).getContext('2d');
        g.drawImage(b, 0, 0);
        b.close();
        return new Uint8Array(g.getImageData(0, 0, cw, ch).data.buffer);
      };
      engine.setSource(src);
      engine.setLut(lut);
      await engine.ready();
      engine.render(P(params));
      const before = readCanvas();
      const t0 = performance.now();
      const active = bmpPixels(await engine.renderRegion(src, lut, P(params), rect, cw, ch)); // gecachte Effektkarte
      const ms = performance.now() - t0;
      const other = bmpPixels(await engine.renderRegion({ ...src, id: 'kopie' }, lut, P(params), rect, cw, ch)); // eigene Karte
      const orig = bmpPixels(await engine.renderRegion(src, lut, P(params), rect, cw, ch, { showOriginal: true }));
      engine.render(P(params));
      const after = readCanvas();
      const full = await engine.exportPixels(src, lut, P(params), {});
      const ref = crop(full, x0, y0, cw, ch);
      const srcRef = crop({ data: await srgbReference(name), width: src.width }, x0, y0, cw, ch);
      const errors = {};
      for (const [k, r, o] of [['zuGross', { x0: 0, y0: 0, x1: 5000, y1: 100 }, {}], ['abgebrochen', rect, { signal: AbortSignal.abort() }]]) {
        try { await engine.renderRegion(src, lut, P(params), r, r.x1 - r.x0, r.y1 - r.y0, o); errors[k] = 'kein Fehler'; } catch (e) { errors[k] = e.name + ': ' + e.message; }
      }
      return {
        rect: [x0, y0, cw, ch], ms, active: diff(active, ref), other: diff(other, ref), original: diff(orig, srcRef),
        preview: diff(before.data, after.data), errors,
        png: await png(active, cw, ch),
      };
    },

    dispose() {
      engine.dispose();
      engine = createEngine(canvas); // gleicher Canvas, z. B. React StrictMode
      return 'ok';
    },
  };
  window.ready = true;
</script>
</body>
