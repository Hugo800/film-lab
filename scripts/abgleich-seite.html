<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Abgleich</title></head>
<body>
<canvas id="c" width="64" height="64"></canvas>
<script type="module">
  // Prüfseite für scripts/abgleich-pipeline.mjs: ganze Pipeline (echte Engine, echte Looks) gegen Kamerabilder.
  // Referenzbilder kommen nur lokal aus /testbilder/ und werden nirgends gespeichert außer in test-output/.
  import { createEngine } from '/src/engine/index.ts';
  import { loadFile } from '/src/io/index.ts';
  import { LOOKS, buildOfficialLuts } from '/src/looks/index.ts';
  import { DEFAULT_PARAMS } from '/src/types.ts';

  const engine = createEngine(document.getElementById('c'));
  const imgs = new Map(); // Schlüssel → { width, height, data: RGBA }
  const luts = new Map();
  let official = new Map();
  const sources = new Map(); // URL → geladenes Nutzerfoto (SourceImage)
  const lookOf = (id) => LOOKS.find((l) => l.id === id);
  const lutOf = (id) => luts.get(id) ?? luts.set(id, lookOf(id).buildLut()).get(id);
  const paramsOf = (id, extra) => ({ ...DEFAULT_PARAMS, ...(id ? lookOf(id).defaults : {}), ...extra });

  // --- Farbe: sRGB → CIELAB (D65) und ΔE2000 ---
  const lin = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  const fLab = (t) => (t > 216 / 24389 ? Math.cbrt(t) : ((24389 / 27) * t + 16) / 116);
  function toLab(r, g, b) {
    const R = lin(r / 255), G = lin(g / 255), B = lin(b / 255);
    const fx = fLab((0.4124564 * R + 0.3575761 * G + 0.1804375 * B) / 0.95047);
    const fy = fLab(0.2126729 * R + 0.7151522 * G + 0.072175 * B);
    const fz = fLab((0.0193339 * R + 0.119192 * G + 0.9503041 * B) / 1.08883);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  const RAD = Math.PI / 180;
  function dE2000([l1, a1, b1], [l2, a2, b2]) {
    const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cm7 = ((C1 + C2) / 2) ** 7;
    const G = 0.5 * (1 - Math.sqrt(Cm7 / (Cm7 + 6103515625)));
    const a1p = (1 + G) * a1, a2p = (1 + G) * a2, C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
    const hh = (b, a) => { const t = Math.atan2(b, a) / RAD; return t < 0 ? t + 360 : t; };
    const h1 = C1p === 0 ? 0 : hh(b1, a1p), h2 = C2p === 0 ? 0 : hh(b2, a2p);
    let dh = h2 - h1;
    if (C1p * C2p === 0) dh = 0; else if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
    const dH = 2 * Math.sqrt(C1p * C2p) * Math.sin((dh * RAD) / 2);
    const Lm = (l1 + l2) / 2, Cmp = (C1p + C2p) / 2;
    let hm = h1 + h2;
    if (C1p * C2p !== 0) hm = Math.abs(h1 - h2) <= 180 ? hm / 2 : (hm + (hm < 360 ? 360 : -360)) / 2;
    const T = 1 - 0.17 * Math.cos((hm - 30) * RAD) + 0.24 * Math.cos(2 * hm * RAD) + 0.32 * Math.cos((3 * hm + 6) * RAD) - 0.2 * Math.cos((4 * hm - 63) * RAD);
    const dTh = 30 * Math.exp(-(((hm - 275) / 25) ** 2)), Cmp7 = Cmp ** 7;
    const Rc = 2 * Math.sqrt(Cmp7 / (Cmp7 + 6103515625));
    const Sl = 1 + (0.015 * (Lm - 50) ** 2) / Math.sqrt(20 + (Lm - 50) ** 2), Sc = 1 + 0.045 * Cmp, Sh = 1 + 0.015 * Cmp * T;
    const x = (l2 - l1) / Sl, y = (C2p - C1p) / Sc, z = dH / Sh;
    return Math.sqrt(Math.max(0, x * x + y * y + z * z - Math.sin(2 * dTh * RAD) * Rc * y * z));
  }
  /** Mittleres ΔE2000; mit sel(labA, pixelIndex) nur über ausgewählte Pixel. */
  function meanDE(A, B, sel) {
    let s = 0, n = 0;
    for (let i = 0; i < A.data.length; i += 4) {
      const p = toLab(A.data[i], A.data[i + 1], A.data[i + 2]);
      if (sel && !sel(p, i / 4)) continue;
      s += dE2000(p, toLab(B.data[i], B.data[i + 1], B.data[i + 2]));
      n++;
    }
    return { de: s / Math.max(1, n), n };
  }

  // --- Bilder ---
  // Große Dateien: fetch().blob() scheitert in Headless Chrome („Failed to fetch“), arrayBuffer() nicht.
  const blobOf = async (url) => new Blob([await (await fetch(url)).arrayBuffer()]);
  /** Dekodiert ohne Farbraumumrechnung, lange Kante höchstens edge (bzw. genau w×h). */
  async function decode(url, edge, size) {
    const full = await createImageBitmap(await blobOf(url), { colorSpaceConversion: 'none' });
    const k = size ? 1 : Math.min(1, edge / Math.max(full.width, full.height));
    const w = size ? size[0] : Math.round(full.width * k), h = size ? size[1] : Math.round(full.height * k);
    const bm = w === full.width && h === full.height ? full : await createImageBitmap(full, { resizeWidth: w, resizeHeight: h, resizeQuality: 'high' });
    const c = new OffscreenCanvas(w, h), g = c.getContext('2d');
    g.drawImage(bm, 0, 0);
    return { width: w, height: h, data: new Uint8Array(g.getImageData(0, 0, w, h).data.buffer) };
  }
  const asSource = (img, name) => ({ id: name, fileName: name, width: img.width, height: img.height, colorSpace: 'srgb', pixels: img, meta: {}, isRaw: false });
  const run = (img, lut, params) => engine.exportPixels(asSource(img, 'x'), lut, params);
  const crop = (img, [x0, y0, w, h]) => {
    const out = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) out.set(img.data.subarray(((y0 + y) * img.width + x0) * 4, ((y0 + y) * img.width + x0 + w) * 4), y * w * 4);
    return { width: w, height: h, data: out };
  };

  const A = {
    paramsOf: (id) => paramsOf(id),
    looks: (cat) => LOOKS.filter((l) => !cat || l.category === cat).map((l) => ({ id: l.id, name: l.name, category: l.category, officialKey: l.officialKey, baseLookId: l.baseLookId, monochrome: !!l.monochrome })),

    /** Offizielle Fujifilm-LUTs über buildOfficialLuts (wie „Originale verwenden“ in der App). */
    async official(url) {
      const data = new Uint8Array(await (await fetch(url)).arrayBuffer());
      const t0 = performance.now();
      official = await buildOfficialLuts([{ name: url.split('/').pop(), data }]);
      return { keys: [...official.keys()], ms: Math.round(performance.now() - t0) };
    },

    /**
     * Bildpaar [Provia, Kamera]: unser Look und (falls vorhanden) das Original auf das Provia-Bild,
     * ΔE2000 jeweils zum Kamerabild. Kacheln unter key/p, key/o, key/f, key/k.
     * skipTop: oberen Anteil nicht werten (Beschriftung in Peltiers Raster).
     */
    async pair(key, provUrl, camUrl, lookId, edge, skipTop = 0) {
      const P = await decode(provUrl, edge);
      const K = await decode(camUrl, 0, [P.width, P.height]);
      const look = lookOf(lookId);
      const own = await run(P, lutOf(lookId), paramsOf(lookId));
      const offLut = look.officialKey && official.get(look.officialKey);
      const off = offLut ? await run(P, offLut, paramsOf(lookId)) : null;
      imgs.set(`${key}/p`, P); imgs.set(`${key}/o`, own); imgs.set(`${key}/k`, K);
      if (off) imgs.set(`${key}/f`, off);
      const sel = skipTop ? (_, i) => i >= Math.round(skipTop * P.height) * P.width : null;
      return { none: meanDE(P, K, sel).de, own: meanDE(own, K, sel).de, off: off ? meanDE(off, K, sel).de : null, w: P.width, h: P.height };
    },

    /** Referenzbild in den Speicher (für Bögen und Messungen). */
    async load(key, url, edge, size) {
      const img = await decode(url, edge, size);
      imgs.set(key, img);
      return { w: img.width, h: img.height };
    },

    /** Engine auf ein gespeichertes Bild: look (id oder null) + Einstellungen. */
    async apply(key, from, lookId, extra, cut) {
      const img = await run(imgs.get(from), lookId ? lutOf(lookId) : null, paramsOf(lookId, extra));
      imgs.set(key, cut ? crop(img, cut) : img);
      return { w: img.width, h: img.height };
    },

    /** Nutzerfoto über loadFile (EXIF-Drehung, P3) durch die Engine, optional nur Ausschnitt behalten. */
    async photo(key, url, lookId, extra, maxEdge, cut) {
      const name = url.split('/').pop();
      if (!sources.has(url)) sources.set(url, await loadFile(new File([await blobOf(url)], name, { type: 'image/jpeg' })));
      const src = sources.get(url);
      const img = await engine.exportPixels(src, lookId ? lutOf(lookId) : null, paramsOf(lookId, extra), { maxEdge });
      imgs.set(key, cut ? crop(img, cut) : img);
      return { w: img.width, h: img.height };
    },

    cut(key, from, rect) { imgs.set(key, crop(imgs.get(from), rect)); },

    /** ΔE2000 zwischen zwei gespeicherten Bildern; satt = nur Pixel mit C* > minC im ersten. */
    de(a, b, minC = 0) {
      const sel = minC ? (p) => Math.hypot(p[1], p[2]) > minC : null;
      return meanDE(imgs.get(a), imgs.get(b), sel);
    },

    /** Mittleres L*, a*, b* und Chroma eines Bildes. */
    labMean(key) {
      const I = imgs.get(key);
      const s = [0, 0, 0, 0];
      for (let i = 0; i < I.data.length; i += 4) {
        const p = toLab(I.data[i], I.data[i + 1], I.data[i + 2]);
        s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3] += Math.hypot(p[1], p[2]);
      }
      const n = I.data.length / 4;
      return s.map((v) => v / n);
    },

    /**
     * Wirkung eines Effekts nach Farbton und Chroma: ΔL* und Chroma-Verhältnis zwischen „aus“ und „an“,
     * gruppiert nach Farbtonsektor (60°) des „aus“-Bildes, nur Pixel mit C* > minC.
     */
    effect(off, on, minC = 25) {
      const O = imgs.get(off), N = imgs.get(on);
      const g = {};
      for (let i = 0; i < O.data.length; i += 4) {
        const p = toLab(O.data[i], O.data[i + 1], O.data[i + 2]), q = toLab(N.data[i], N.data[i + 1], N.data[i + 2]);
        const C = Math.hypot(p[1], p[2]);
        const h = (Math.atan2(p[2], p[1]) / RAD + 360) % 360;
        const sec = C < minC ? 'neutral' : `${Math.floor(h / 60) * 60}°`;
        const e = (g[sec] ??= { n: 0, dL: 0, c0: 0, c1: 0 });
        e.n++; e.dL += q[0] - p[0]; e.c0 += C; e.c1 += Math.hypot(q[1], q[2]);
      }
      return Object.fromEntries(Object.entries(g).map(([k, e]) => [k, { n: e.n, dL: e.dL / e.n, cRatio: e.c1 / e.c0 }]));
    },

    /**
     * Kornmaß in 8-Bit-Luma: Hochpass „Luma − Gauß σ 3“ je 32×32-Block; ausgewertet werden die
     * glattesten Blöcke (unteres Fünftel der Tieffrequenz-Steigung). Liefert σ und Autokorrelation bei 1 px.
     */
    grain(key) {
      const I = imgs.get(key), w = I.width, h = I.height;
      const Y = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) Y[i] = 0.2126 * I.data[i * 4] + 0.7152 * I.data[i * 4 + 1] + 0.0722 * I.data[i * 4 + 2];
      const blur = (src, horiz) => {
        const k = [], s = 3, r = 9;
        for (let i = -r; i <= r; i++) k.push(Math.exp(-(i * i) / (2 * s * s)));
        const ks = k.reduce((a, b) => a + b);
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            let a = 0;
            for (let i = -r; i <= r; i++) {
              const xx = horiz ? Math.min(w - 1, Math.max(0, x + i)) : x, yy = horiz ? y : Math.min(h - 1, Math.max(0, y + i));
              a += k[i + r] * src[yy * w + xx];
            }
            out[y * w + x] = a / ks;
          }
        return out;
      };
      const low = blur(blur(Y, true), false);
      const B = 32, blocks = [];
      for (let by = 1; by + B < h - 1; by += B)
        for (let bx = 1; bx + B < w - 1; bx += B) {
          let s2 = 0, ac = 0, grad = 0, m = 0, n = 0;
          for (let y = by; y < by + B; y++)
            for (let x = bx; x < bx + B; x++) {
              const i = y * w + x, d = Y[i] - low[i], dr = Y[i + 1] - low[i + 1], dd = Y[i + w] - low[i + w];
              s2 += d * d; ac += d * (dr + dd) / 2; m += Y[i]; n++;
              grad += Math.abs(low[i + 1] - low[i]) + Math.abs(low[i + w] - low[i]);
            }
          blocks.push({ sigma: Math.sqrt(s2 / n), ac: ac / s2, grad: grad / n, mean: m / n });
        }
      blocks.sort((a, b) => a.grad - b.grad);
      const sm = blocks.slice(0, Math.max(3, Math.floor(blocks.length / 5)));
      const med = (f) => { const v = sm.map(f).sort((a, b) => a - b); return v[v.length >> 1]; };
      return { sigma: med((b) => b.sigma), ac1: med((b) => b.ac), luma: med((b) => b.mean), blocks: sm.length };
    },

    /**
     * Kornstärke nach Helligkeit: σ des Hochpasses (Luma − Gauß σ 2) in glatten 16×16-Blöcken,
     * Median je Luma-Klasse (Breite 16). Liefert [{ luma, sigma, n }].
     */
    grainCurve(key, maxGrad = 0.6) {
      const I = imgs.get(key), w = I.width, h = I.height;
      const Y = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) Y[i] = 0.2126 * I.data[i * 4] + 0.7152 * I.data[i * 4 + 1] + 0.0722 * I.data[i * 4 + 2];
      const r = 6, k = [];
      for (let i = -r; i <= r; i++) k.push(Math.exp(-(i * i) / 8));
      const ks = k.reduce((a, b) => a + b);
      const pass = (src, dx, dy) => {
        const out = new Float32Array(w * h);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            let a = 0;
            for (let i = -r; i <= r; i++) a += k[i + r] * src[Math.min(h - 1, Math.max(0, y + i * dy)) * w + Math.min(w - 1, Math.max(0, x + i * dx))];
            out[y * w + x] = a / ks;
          }
        return out;
      };
      const low = pass(pass(Y, 1, 0), 0, 1);
      const bins = {};
      const B = 16;
      for (let by = r; by + B < h - r; by += B)
        for (let bx = r; bx + B < w - r; bx += B) {
          let s2 = 0, m = 0, grad = 0;
          for (let y = by; y < by + B; y++)
            for (let x = bx; x < bx + B; x++) {
              const i = y * w + x, d = Y[i] - low[i];
              s2 += d * d; m += Y[i];
              grad += Math.abs(low[i + 1] - low[i]) + Math.abs(low[i + w] - low[i]);
            }
          if (grad / (B * B) > maxGrad) continue;
          const bin = Math.floor(m / (B * B) / 16);
          (bins[bin] ??= []).push(Math.sqrt(s2 / (B * B)));
        }
      return Object.entries(bins).filter(([, v]) => v.length >= 4).map(([b, v]) => {
        v.sort((x, y) => x - y);
        return { luma: Number(b) * 16 + 8, sigma: v[v.length >> 1], n: v.length };
      }).sort((a, b) => a.luma - b.luma);
    },

    /** Grauverlauf (links schwarz, rechts weiß) als Quelle. */
    ramp(key, w, h) {
      const data = new Uint8Array(w * h * 4);
      for (let y = 0; y < h; y++)
        for (let x = 0; x < w; x++) {
          const v = Math.round((x / (w - 1)) * 255), i = (y * w + x) * 4;
          data[i] = data[i + 1] = data[i + 2] = v; data[i + 3] = 255;
        }
      imgs.set(key, { width: w, height: h, data });
    },

    /**
     * Bogen aus gespeicherten Bildern: rows = [[{ key, label, rect?, zoom? } | null, …], …].
     * Kacheln werden auf tileW Breite gebracht (zoom: nächster Nachbar, sonst glatt). Liefert PNG als Data-URL.
     */
    async sheet(rows, tileW, title) {
      const LABEL = 24, TITLE = title ? 34 : 0;
      const tiles = rows.map((r) => r.map((t) => {
        if (!t) return null;
        let img = imgs.get(t.key);
        if (!img) throw new Error(`Bild fehlt: ${t.key}`);
        if (t.rect) img = crop(img, t.rect);
        return { ...t, img, h: Math.round((img.height * tileW) / img.width) };
      }));
      const cols = Math.max(...rows.map((r) => r.length));
      const rowH = tiles.map((r) => Math.max(...r.filter(Boolean).map((t) => t.h)) + LABEL);
      const c = new OffscreenCanvas(cols * tileW + (cols - 1) * 4, TITLE + rowH.reduce((a, b) => a + b, 0)), g = c.getContext('2d');
      g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, c.width, c.height);
      g.textBaseline = 'middle';
      if (title) { g.fillStyle = '#fff'; g.font = 'bold 20px sans-serif'; g.fillText(title, 8, TITLE / 2); }
      let y0 = TITLE;
      tiles.forEach((r, ri) => {
        r.forEach((t, ci) => {
          if (!t) return;
          const x = ci * (tileW + 4);
          g.fillStyle = '#eee'; g.font = '15px sans-serif';
          g.fillText(t.label, x + 6, y0 + LABEL / 2, tileW - 12);
          const tc = new OffscreenCanvas(t.img.width, t.img.height);
          tc.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(t.img.data.buffer, t.img.data.byteOffset, t.img.data.length), t.img.width, t.img.height), 0, 0);
          g.imageSmoothingEnabled = !t.zoom;
          g.imageSmoothingQuality = 'high';
          g.drawImage(tc, x, y0 + LABEL, tileW, t.h);
        });
        y0 += rowH[ri];
      });
      const blob = await c.convertToBlob({ type: 'image/png' });
      return new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    },

    /**
     * Farbstich-Differenz B − A über fast neutrale Pixel (C* < maxC in beiden, L* 25..90): Median von Δa*, Δb*.
     */
    castDiff(a, b, maxC = 12) {
      const I = imgs.get(a), J = imgs.get(b), da = [], db = [];
      for (let i = 0; i < I.data.length; i += 4) {
        const p = toLab(I.data[i], I.data[i + 1], I.data[i + 2]), q = toLab(J.data[i], J.data[i + 1], J.data[i + 2]);
        if (Math.hypot(p[1], p[2]) > maxC || Math.hypot(q[1], q[2]) > maxC || p[0] < 25 || p[0] > 90) continue;
        da.push(q[1] - p[1]); db.push(q[2] - p[2]);
      }
      const med = (v) => v.sort((x, y) => x - y)[v.length >> 1];
      return { da: med(da), db: med(db), n: da.length };
    },

    /** RGBA-Pixel eines gespeicherten Bildes als Base64 (für Anpassungen in Node). */
    async pixels(key) {
      const I = imgs.get(key);
      const url = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(new Blob([I.data])); });
      return { w: I.width, h: I.height, b64: url.split(',')[1] };
    },

    drop(prefix) { for (const k of [...imgs.keys()]) if (k.startsWith(prefix)) imgs.delete(k); },
  };
  window.A = A;
  window.ready = true;
</script>
</body>
</html>
